# Closes the alert gap documented in docs/slo.md: CodeQL Analysis and
# OpenSSF Scorecard already run on a weekly schedule, but nothing alerts if
# a *scheduled* run itself fails to complete. Fuzzing is included here on
# the assumption the fuzz.yml schedule change is applied alongside
# this file; Homebrew CI / Validate Formulae are also watched for
# main-branch failures, since a red main check is the primary user-facing
# signal for this tap (see docs/slo.md). Stale Issues (stale.yml, daily
# `0 0 * * *`) is watched too — it is a schedule-triggered workflow with the
# exact same "no alert if the scheduled run itself fails" gap (see #365).
#
# The comment/issue markdown bodies below are rendered by
# scripts/workflow_failure_notify.sh (regression-tested by
# scripts/test_workflow_failure_notify.sh) rather than inlined as
# untested printf/heredoc blocks, matching the tested-script pattern
# already used for fuzz_summary.sh, brew_ci_summary.sh, and
# verify_release_health.sh in this repo.
#
# Auto-filed issues are labeled `lifecycle/frozen` in addition to
# `kind/bug` so the stale-bot (`.github/workflows/stale.yml`) cannot
# silently auto-close an unresolved workflow-failure tracking issue after
# 90 days of inactivity — `lifecycle/frozen` is one of `reusable-stale.yml`'s
# default exempt labels, whereas `kind/bug` alone is not (see #327, which
# fixed the same gap for the Incident Report template and flagged this
# workflow as still needing the same fix once applied).
name: Open Issue on Scheduled Workflow Failure

on:
  workflow_run:
    workflows:
      - "CodeQL Analysis"
      - "OpenSSF Scorecard"
      - "Fuzzing"
      - "Homebrew CI"
      - "Validate Formulae"
      - "Stale Issues"
      - "actionlint"
    types:
      - completed

permissions: read-all  # default read; writes scoped to job below

jobs:
  open-issue:
    permissions:
      contents: read  # needed: checkout repository for scripts/workflow_failure_notify.sh
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.name == 'Homebrew CI' ||
         github.event.workflow_run.name == 'Validate Formulae')))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for existing open issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          LABEL="workflow-failure"
          SEARCH_TITLE="Workflow failure: ${WORKFLOW_NAME}"
          export SEARCH_TITLE

          EXISTING=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --label "$LABEL" \
            --search "in:title \"${SEARCH_TITLE}\"" \
            --json number,title \
            --jq '.[] | select(.title == env.SEARCH_TITLE) | .number' \
          )

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Found existing issue #${EXISTING}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failed jobs for comment
        if: steps.check.outputs.exists == 'true'
        id: comment-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        # Failed-job lookup is delegated to scripts/workflow_failure_notify.sh
        # failed-jobs (regression-tested by
        # scripts/test_workflow_failure_notify_failed_jobs.sh) rather than an
        # inline `gh run view … --jq …` snippet, so the swallow-on-error
        # contract survives edits.
        run: |
          FAILED_JOBS=$(scripts/workflow_failure_notify.sh failed-jobs)
          echo "failed_jobs=${FAILED_JOBS}" >> "$GITHUB_OUTPUT"

      - name: Comment on existing issue
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_JOBS: ${{ steps.comment-details.outputs.failed_jobs }}
        # Body rendering is delegated to scripts/workflow_failure_notify.sh
        # (regression-tested by scripts/test_workflow_failure_notify.sh)
        # rather than inlined here, so the markdown contract survives edits.
        run: |
          BODY_FILE="$GITHUB_WORKSPACE/workflow-failure-comment.md"
          scripts/workflow_failure_notify.sh comment-body > "$BODY_FILE"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file "$BODY_FILE"

          rm -f "$BODY_FILE"

      - name: Ensure label exists
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create "workflow-failure" \
            --repo "$REPOSITORY" \
            --description "Automated: scheduled or main-branch workflow failed" \
            --color "d93f0b" \
            2>/dev/null || true

      - name: Fetch failed job details
        if: steps.check.outputs.exists == 'false'
        id: details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        # Failed-job lookup is delegated to scripts/workflow_failure_notify.sh
        # failed-jobs (regression-tested by
        # scripts/test_workflow_failure_notify_failed_jobs.sh) rather than an
        # inline `gh run view … --jq …` snippet, so the swallow-on-error
        # contract survives edits.
        run: |
          FAILED_JOBS=$(scripts/workflow_failure_notify.sh failed-jobs)
          echo "failed_jobs=${FAILED_JOBS}" >> "$GITHUB_OUTPUT"

      - name: Open new issue
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_FILE: ${{ github.event.workflow_run.path }}
          FAILED_JOBS: ${{ steps.details.outputs.failed_jobs }}
        # Body rendering is delegated to scripts/workflow_failure_notify.sh
        # (regression-tested by scripts/test_workflow_failure_notify.sh)
        # rather than inlined here, so the markdown contract survives edits.
        run: |
          BODY_FILE="$GITHUB_WORKSPACE/workflow-failure-issue.md"
          TITLE="Workflow failure: ${WORKFLOW_NAME}"

          scripts/workflow_failure_notify.sh issue-body > "$BODY_FILE"

          gh issue create \
            --repo "$REPOSITORY" \
            --title "$TITLE" \
            --label "workflow-failure,kind/bug,lifecycle/frozen" \
            --body-file "$BODY_FILE"

          rm -f "$BODY_FILE"
