name: Fuzzing

on:
  push:
    branches: [ "main" ]
    paths:
      - "Formula/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Formula/**"
  schedule:
    # Weekly catch-all so formula syntax/structure/URL-checksum fuzzing runs
    # independent of a Formula/** diff, mirroring codeql.yml's `0 4 * * 1`
    # weekly cadence (offset by 4h to avoid piling onto the same slot). See
    # #337 for the gap this closes.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      
      - name: Formula fuzzing (syntax + structure + URL/checksum)
        # Delegates to scripts/formula_fuzz.sh (regression-tested by
        # scripts/test_formula_fuzz.sh) so the three-phase fuzzing logic
        # stays in one tested place instead of ~60 lines of inline bash
        # here. See #465 / #479 for the same pattern applied to the
        # shell-test discovery loop and the summary emitters.
        run: scripts/formula_fuzz.sh Formula
      
      - name: Emit CI-observability summary
        # Bounded, stdout-only JSON summary line for CI-log observability,
        # mirroring VALIDATE_FORMULAE_SUMMARY (validate_formulae.py),
        # VERIFY_RELEASE_HEALTH_SUMMARY (verify_release_health.sh), and
        # BREW_CI_SUMMARY (brew_ci_summary.sh): no exporter, no metrics
        # backend, no external data flow — just a grep-able, fixed-shape
        # record of this job's outcome. Runs even when an earlier step
        # failed so the record always appears.
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/fuzz_summary.sh
