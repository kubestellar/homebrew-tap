name: Validate Formulae

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'README.md'
      - 'scripts/validate_formulae.py'
      - 'scripts/test_*.py'
      - 'scripts/*.sh'
      - 'scripts/test_*.sh'
      - '.github/workflows/validate-formulae.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'README.md'
      - 'scripts/validate_formulae.py'
      - 'scripts/test_*.py'
      - 'scripts/*.sh'
      - 'scripts/test_*.sh'
      - '.github/workflows/validate-formulae.yml'

permissions: read-all

jobs:
  validate-formulae:
    name: unit tests + drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read  # needed: checkout repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run all scripts/test_*.py unit tests
        # Use unittest discover so every scripts/test_*.py is picked up
        # automatically. Enumerating files by name is a silent-skip trap
        # (see #268). -v surfaces per-test output so a 'Ran 0 tests'
        # regression is visible in the job log; --buffer keeps output
        # clean on success.
        run: python3 -u -m unittest discover -v --buffer -s scripts -p 'test_*.py'

      - name: Run scripts/test_*.sh shell regression tests
        # Enumerating by glob (not by name) so any new scripts/test_*.sh
        # file is picked up automatically. See #390: these suites existed
        # but were never wired into CI, so a regression to the scripts
        # they guard (brew_ci_summary.sh, fuzz_summary.sh, etc.) could
        # land silently.
        run: |
          failed=0
          for t in scripts/test_*.sh; do
            echo "== $t =="
            bash "$t" || failed=$((failed + 1))
          done
          exit "$failed"

      - name: Run Formula drift check
        run: python3 -u scripts/validate_formulae.py Formula
