name: Validate Formulae

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'README.md'
      - 'scripts/validate_formulae.py'
      - 'scripts/test_*.py'
      - 'scripts/*.sh'
      - 'scripts/test_*.sh'
      - '.github/workflows/validate-formulae.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'README.md'
      - 'scripts/validate_formulae.py'
      - 'scripts/test_*.py'
      - 'scripts/*.sh'
      - 'scripts/test_*.sh'
      - '.github/workflows/validate-formulae.yml'
  schedule:
    # Daily catch-all so the drift check (unit tests + upstream artifact
    # verification) re-runs even absent a Formula/** diff — e.g. an upstream
    # kubestellar-mcp release deleted/re-tagged/pruned, a transient CDN 404 on
    # a pinned release URL, or a yanked binary after its sha256 was already
    # pinned. Mirrors brew-ci.yml's `17 6 * * *` and fuzz.yml's `0 8 * * 1`
    # cadences, offset to avoid piling onto the same slot.
    - cron: '43 7 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-formulae:
    name: unit tests + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # needed: checkout repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned test dependencies
        # requirements-dev.txt pins pytest, pytest-cov, and coverage so a
        # newly-published (potentially malicious) PyPI release cannot be
        # pulled into CI silently. See #5883 / #5884 for rationale.
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run all scripts/test_*.py unit tests
        # Delegates to scripts/unittest_summary.sh (regression-tested by
        # scripts/test_unittest_summary.sh) so the unittest discover
        # invocation and its structured UNITTEST_SUMMARY: outcome record
        # stay in one tested place instead of inlined bash here.
        # COVERAGE_SOURCE keeps this step's `coverage run --source=scripts`
        # instrumentation (added after unittest_summary.sh was written) so
        # the "Enforce coverage gate" step below keeps working unchanged.
        env:
          PYTHONUNBUFFERED: "1"
          COVERAGE_SOURCE: scripts
        run: scripts/unittest_summary.sh

      - name: Enforce 100% coverage gate
        env:
          COVERAGE_MIN: "100"
        # Keep the CI gate aligned with .coveragerc so every
        # supply-chain-critical helper stays at the 100% ratchet.
        run: python3 scripts/coverage_gate.py --min 100

      - name: Generate coverage XML report
        if: always()
        run: coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validate-formulae-coverage
          path: |
            .coverage
            coverage.xml
          retention-days: 14

      - name: Run scripts/test_*.sh shell regression tests
        # Delegates to scripts/run_shell_tests.sh (regression-tested by
        # scripts/test_run_shell_tests.sh) so the discover-and-run logic
        # for scripts/test_*.sh stays in one tested place instead of
        # inlined bash here. See #390 (shell tests never wired into CI)
        # and #465 (this step used to re-implement the wrapper's
        # discovery loop untested). Discovery includes
        # test_run_shell_tests.sh itself, so wrapper regressions still
        # fail CI; the wrapper's self-exclusion guard prevents recursion.
        run: bash scripts/run_shell_tests.sh

      - name: Run Formula drift check
        run: python3 -u scripts/validate_formulae.py Formula
