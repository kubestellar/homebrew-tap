name: Validate Formulae

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'README.md'
      - 'scripts/validate_formulae.py'
      - 'scripts/test_*.py'
      - 'scripts/*.sh'
      - 'scripts/test_*.sh'
      - '.github/workflows/validate-formulae.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'README.md'
      - 'scripts/validate_formulae.py'
      - 'scripts/test_*.py'
      - 'scripts/*.sh'
      - 'scripts/test_*.sh'
      - '.github/workflows/validate-formulae.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-formulae:
    name: unit tests + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # needed: checkout repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install coverage
        run: pip install --disable-pip-version-check coverage

      - name: Run all scripts/test_*.py unit tests
        # Delegates to scripts/unittest_summary.sh (regression-tested by
        # scripts/test_unittest_summary.sh) so the unittest discover
        # invocation and its structured UNITTEST_SUMMARY: outcome record
        # stay in one tested place instead of inlined bash here.
        # COVERAGE_SOURCE keeps this step's `coverage run --source=scripts`
        # instrumentation (added after unittest_summary.sh was written) so
        # the "Enforce coverage gate" step below keeps working unchanged.
        env:
          PYTHONUNBUFFERED: "1"
          COVERAGE_SOURCE: scripts
        run: scripts/unittest_summary.sh

      - name: Enforce coverage gate on scripts/validate_formulae.py
        # Scoped to the production drift-check script only: the
        # test_*.py files themselves contain defensive skipTest guards
        # (e.g. when Formula/ doesn't exist) whose skip paths are
        # legitimately uncovered in CI, so gating on total repo coverage
        # would be noisy. 95% leaves headroom over the current 100%.
        run: coverage report --fail-under=95 --include='scripts/validate_formulae.py'

      - name: Generate coverage XML report
        if: always()
        run: coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validate-formulae-coverage
          path: |
            .coverage
            coverage.xml
          retention-days: 14

      - name: Run scripts/test_*.sh shell regression tests
        # Enumerating by glob (not by name) so any new scripts/test_*.sh
        # file is picked up automatically. See #390: these suites existed
        # but were never wired into CI, so a regression to the scripts
        # they guard (brew_ci_summary.sh, fuzz_summary.sh, etc.) could
        # land silently.
        run: |
          failed=0
          for t in scripts/test_*.sh; do
            echo "== $t =="
            bash "$t" || failed=$((failed + 1))
          done
          exit "$failed"

      - name: Run Formula drift check
        run: python3 -u scripts/validate_formulae.py Formula
