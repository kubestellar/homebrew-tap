name: Homebrew CI

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/brew-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/brew-ci.yml'
  schedule:
    # Daily catch-all to detect upstream artifact rot (deleted/rotated release
    # assets, URL/SHA256 drift) even absent a Formula/** change
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brew-audit-and-install:
    name: brew audit + install smoke test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read  # needed: checkout repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Set up Homebrew tap
        env:
          TAP_DIR: ${{ github.workspace }}
        run: scripts/brew_tap_setup.sh

      - name: brew audit --strict (all formulae)
        run: scripts/brew_audit_all.sh

      - name: brew install smoke test (available formulae)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: scripts/brew_install_smoke.sh

      - name: brew test (installed formulae)
        run: scripts/brew_test_installed.sh

      - name: Untap self before post-cleanup
        # setup-homebrew's post-job cleanup on Linux does a plain `rm` (not
        # `rm -rf`) on its pre-registered tap directory. Because we retap
        # kubestellar/tap to this checkout earlier in the job, that directory
        # still exists (non-empty) at post-job time and the plain `rm` fails
        # with "Is a directory", failing the whole job even though every
        # audit/install/test step above passed. Untapping here removes the
        # directory before Post-"Set up Homebrew on Linux" runs, since GitHub
        # Actions runs post steps only after all regular steps (including
        # this one) complete. See #322, #426, #486 (see
        # scripts/brew_untap_self.sh for the full postmortem detail).
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: scripts/brew_untap_self.sh

      - name: Emit CI-observability summary
        # Bounded, stdout-only JSON summary line for CI-log observability,
        # mirroring VALIDATE_FORMULAE_SUMMARY (validate_formulae.py) and
        # VERIFY_RELEASE_HEALTH_SUMMARY (verify_release_health.sh): no
        # exporter, no metrics backend, no external data flow — just a
        # grep-able, fixed-shape record of this job's outcome. Runs even
        # when an earlier step failed so the record always appears.
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MATRIX_OS: ${{ matrix.os }}
        run: scripts/brew_ci_summary.sh
