name: Homebrew CI

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/brew-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/brew-ci.yml'
  schedule:
    # Daily catch-all to detect upstream artifact rot (deleted/rotated release
    # assets, URL/SHA256 drift) even absent a Formula/** change
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brew-audit-and-install:
    name: brew audit + install smoke test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read  # needed: checkout repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Set up Homebrew tap
        run: |
          # setup-homebrew on Linux pre-registers kubestellar/tap with the remote URL.
          # Rewire to this checkout so brew resolves in-tree formula edits.
          brew untap kubestellar/tap || true
          # Newer Homebrew enforces a tap-trust model: tapping a local path
          # exits non-zero ("untrusted tap") until `brew trust` is run, so
          # tolerate the tap failure and trust the tap when supported.
          tap_failed=0
          brew tap kubestellar/tap "$(pwd)" || tap_failed=1
          if brew trust --help >/dev/null 2>&1; then
            brew trust kubestellar/tap
          elif [ "$tap_failed" -ne 0 ]; then
            exit 1
          fi

      - name: brew audit --strict (all formulae)
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            echo "::group::brew audit --strict kubestellar/tap/$name"
            brew audit --strict "kubestellar/tap/$name"
            echo "::endgroup::"
          done

      - name: brew install smoke test (available formulae)
        run: |
          event_name="${{ github.event_name }}"
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            echo "::group::brew fetch kubestellar/tap/$name"
            if brew fetch --formula "kubestellar/tap/$name"; then
              echo "::endgroup::"
              echo "::group::brew install kubestellar/tap/$name"
              brew install --formula "kubestellar/tap/$name"
            else
              echo "::endgroup::"
              if [ "$event_name" = "pull_request" ]; then
                echo "::notice title=Skipping install::Release artifact for kubestellar/tap/$name is not available yet"
                continue
              fi
              echo "::error title=Missing release artifact::kubestellar/tap/$name could not be fetched"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: brew test (installed formulae)
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            if ! brew list --formula | grep -qx "$name"; then
              echo "::notice title=Skipping test::kubestellar/tap/$name was not installed"
              continue
            fi
            echo "::group::brew test kubestellar/tap/$name"
            brew test "kubestellar/tap/$name"
            echo "::endgroup::"
          done

      - name: Untap self before post-cleanup
        # setup-homebrew's post-job cleanup on Linux does a plain `rm` (not
        # `rm -rf`) on its pre-registered tap directory. Because we retap
        # kubestellar/tap to this checkout earlier in the job, that directory
        # still exists (non-empty) at post-job time and the plain `rm` fails
        # with "Is a directory", failing the whole job even though every
        # audit/install/test step above passed. Untapping here removes the
        # directory before Post-"Set up Homebrew on Linux" runs, since GitHub
        # Actions runs post steps only after all regular steps (including
        # this one) complete. See #322.
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: brew untap kubestellar/tap || true

      - name: Emit CI-observability summary
        # Bounded, stdout-only JSON summary line for CI-log observability,
        # mirroring VALIDATE_FORMULAE_SUMMARY (validate_formulae.py) and
        # VERIFY_RELEASE_HEALTH_SUMMARY (verify_release_health.sh): no
        # exporter, no metrics backend, no external data flow — just a
        # grep-able, fixed-shape record of this job's outcome. Runs even
        # when an earlier step failed so the record always appears.
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MATRIX_OS: ${{ matrix.os }}
        run: scripts/brew_ci_summary.sh
