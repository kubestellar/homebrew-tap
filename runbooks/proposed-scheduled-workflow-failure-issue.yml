# PROPOSED WORKFLOW — not yet active.
#
# This agent's GitHub App installation lacks the `workflows: write`
# permission GitHub requires to create/update files under
# `.github/workflows/`, so this ready-to-apply spec is checked in here
# under `runbooks/` instead. A maintainer with `workflows` permission can
# apply it with:
#
#   git mv runbooks/proposed-scheduled-workflow-failure-issue.yml \
#     .github/workflows/scheduled-workflow-failure-issue.yml
#
# and, per the companion recommendation in docs/slo.md, add a weekly
# `schedule:` trigger to `.github/workflows/fuzz.yml` (e.g. `0 8 * * 1`,
# offset from codeql.yml's `0 4 * * 1` and scorecard.yml's `0 6 * * 1`) so
# `Fuzzing` is included in the "scheduled run" alert path below rather than
# only running on `push`/`pull_request`.
#
# --- content below is the workflow as it should read once applied ---
#
# Closes the alert gap documented in docs/slo.md: CodeQL Analysis and
# OpenSSF Scorecard already run on a weekly schedule, but nothing alerts if
# a *scheduled* run itself fails to complete. Fuzzing is included here on
# the assumption the fuzz.yml schedule change above is applied alongside
# this file; Homebrew CI / Validate Formulae are also watched for
# main-branch failures, since a red main check is the primary user-facing
# signal for this tap (see docs/slo.md).
#
# Auto-filed issues are labeled `lifecycle/frozen` in addition to
# `kind/bug` so the stale-bot (`.github/workflows/stale.yml`) cannot
# silently auto-close an unresolved workflow-failure tracking issue after
# 90 days of inactivity — `lifecycle/frozen` is one of `reusable-stale.yml`'s
# default exempt labels, whereas `kind/bug` alone is not (see #327, which
# fixed the same gap for the Incident Report template and flagged this
# workflow as still needing the same fix once applied).
name: Open Issue on Scheduled Workflow Failure

on:
  workflow_run:
    workflows:
      - "CodeQL Analysis"
      - "OpenSSF Scorecard"
      - "Fuzzing"
      - "Homebrew CI"
      - "Validate Formulae"
    types:
      - completed

permissions: read-all  # default read; writes scoped to job below

jobs:
  open-issue:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.name == 'Homebrew CI' ||
         github.event.workflow_run.name == 'Validate Formulae')))
    steps:
      - name: Check for existing open issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          LABEL="workflow-failure"
          SEARCH_TITLE="Workflow failure: ${WORKFLOW_NAME}"
          export SEARCH_TITLE

          EXISTING=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --label "$LABEL" \
            --search "in:title \"${SEARCH_TITLE}\"" \
            --json number,title \
            --jq '.[] | select(.title == env.SEARCH_TITLE) | .number' \
          )

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Found existing issue #${EXISTING}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failed jobs for comment
        if: steps.check.outputs.exists == 'true'
        id: comment-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          FAILED_JOBS=$(gh run view "$RUN_ID" \
            --repo "$REPOSITORY" \
            --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "")
          echo "failed_jobs=${FAILED_JOBS}" >> "$GITHUB_OUTPUT"

      - name: Comment on existing issue
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_JOBS: ${{ steps.comment-details.outputs.failed_jobs }}
        run: |
          BODY_FILE="$GITHUB_WORKSPACE/workflow-failure-comment.md"
          {
            printf '**Still failing** — `%s` failed again.\n\n' "$WORKFLOW_NAME"
            printf -- '- **Run:** [#%s](%s)\n' "$RUN_ID" "$RUN_URL"
            printf -- '- **Time:** %s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            if [ -n "$FAILED_JOBS" ]; then
              printf -- '- **Failed jobs:** `%s`\n' "$FAILED_JOBS"
            fi
          } > "$BODY_FILE"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file "$BODY_FILE"

          rm -f "$BODY_FILE"

      - name: Ensure label exists
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create "workflow-failure" \
            --repo "$REPOSITORY" \
            --description "Automated: scheduled or main-branch workflow failed" \
            --color "d93f0b" \
            2>/dev/null || true

      - name: Fetch failed job details
        if: steps.check.outputs.exists == 'false'
        id: details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          FAILED_JOBS=$(gh run view "$RUN_ID" \
            --repo "$REPOSITORY" \
            --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "")
          echo "failed_jobs=${FAILED_JOBS}" >> "$GITHUB_OUTPUT"

      - name: Open new issue
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_FILE: ${{ github.event.workflow_run.path }}
          FAILED_JOBS: ${{ steps.details.outputs.failed_jobs }}
        run: |
          BODY_FILE="$GITHUB_WORKSPACE/workflow-failure-issue.md"
          TITLE="Workflow failure: ${WORKFLOW_NAME}"

          {
            printf '## Workflow Failure\n\n'
            printf 'The **%s** workflow failed.\n\n' "$WORKFLOW_NAME"
            printf '| Detail | Value |\n'
            printf '|--------|-------|\n'
            printf '| **Workflow** | `%s` |\n' "$WORKFLOW_NAME"
            printf '| **Run** | [#%s](%s) |\n' "$RUN_ID" "$RUN_URL"
            printf '| **File** | `%s` |\n' "$WORKFLOW_FILE"
            printf '| **Time** | %s |\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            if [ -n "$FAILED_JOBS" ]; then
              printf '| **Failed jobs** | `%s` |\n' "$FAILED_JOBS"
            fi
            printf '\n### Next Steps\n'
            printf '1. Check the [failed run](%s) for error details\n' "$RUN_URL"
            printf '2. Follow the [Scheduled Workflow Failure runbook](../../runbooks/scheduled-workflow-failure.md)\n'
            printf '3. Fix the underlying issue\n'
            printf '4. **Do not close** this issue until the workflow passes on `main`\n\n'
            printf -- '---\n'
            printf '*This issue was automatically created by the scheduled workflow failure monitor.*\n'
          } > "$BODY_FILE"

          gh issue create \
            --repo "$REPOSITORY" \
            --title "$TITLE" \
            --label "workflow-failure,kind/bug,lifecycle/frozen" \
            --body-file "$BODY_FILE"

          rm -f "$BODY_FILE"
