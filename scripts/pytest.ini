[pytest]
# scripts/pytest.ini
#
# This config lets developers run the SAME coverage gate that #314 asks CI to
# adopt, without changing the current CI workflow. When a human wires
# `pytest scripts/` (or `make -C scripts coverage`) into
# .github/workflows/validate-formulae.yml (see #314), no test files need to
# move — pytest already collects the existing unittest.TestCase suites
# transparently.
#
# Usage (from repo root):
#   python3 -m pip install -r requirements-dev.txt
#   cd scripts && python3 -m pytest .
#
# Enforces:
#   --cov=validate_formulae   coverage over the supply-chain-critical validator
#   --cov-branch              branch coverage (catches missed decision arms)
#   --cov-fail-under=100      matches the current on-main baseline; a drop is
#                             an error, not a warning.
addopts =
    --cov=validate_formulae
    --cov-branch
    --cov-report=term
    --cov-report=xml:coverage.xml
    --cov-fail-under=100
